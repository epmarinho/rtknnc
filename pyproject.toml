[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtknnc"
version = "0.1.0"
description = "RTKNNC: Round-trip k-NN cluster"
authors = [{ name = "Eraldo Pereira Marinho", email = "pereira.marinho@unesp.br" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]
